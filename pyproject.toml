[build-system]
requires = ["scikit-build-core>=0.10", "nanobind>=2.4"]
build-backend = "scikit_build_core.build"

[project]
name = "transmission_line_waves"
version = "0.1.0"
description = "Nanobind bindings for a transmission-line wave solver"
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "matplotlib",
]

[tool.scikit-build]
minimum-version = "0.10"

[tool.scikit-build.wheel]
packages = []
